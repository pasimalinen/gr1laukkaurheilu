<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>GR1 Kiitolaukkaurheilu</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --gold: #d4af37; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 20px; }
        h1 { color: var(--gold); text-align: center; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        .card h3 { color: var(--gold); margin: 0 0 10px 0; }
        .info { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 5px; }
        .track-link { color: #60a5fa; text-decoration: none; }
        .track-link:hover { text-decoration: underline; }
        .btn-row { margin-top: 15px; display: flex; gap: 8px; flex-wrap: wrap; }
        .btn { padding: 8px 12px; border-radius: 5px; text-decoration: none; font-size: 0.75rem; font-weight: bold; }
        .btn-blue { background: #2563eb; color: white; }
        .btn-red { background: #dc2626; color: white; }
        .btn-green { background: #16a34a; color: white; }
    </style>
</head>
<body>
    <h1>GR1 Kiitolaukkaurheilu 2026</h1>
    <div id="grid" class="grid">Ladataan tietoja...</div>

    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/19VMjcAwo-xSw65m9JiUJ2u0hcgH3eh4DU726nnZDzwg/gviz/tq?tqx=out:csv";

        fetch(csvUrl)
            .then(res => res.text())
            .then(csv => {
                const lines = csv.split('\n').slice(1);
                const grid = document.getElementById('grid');
                grid.innerHTML = '';
                
                lines.forEach(line => {
                    const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if(cols.length > 5) {
                        const name = cols[0].replace(/"/g, '');
                        const trackName = cols[2].replace(/"/g, '');
                        const trackLink = cols[3].replace(/"/g, ''); 
                        const winner = cols[10].replace(/"/g, '');   
                        
                        const racecard = cols[9].replace(/"/g, '');  
                        const video = cols[11].replace(/"/g, '');    
                        const results = cols[13].replace(/"/g, '');  
                        
                        grid.innerHTML += `
                            <div class="card">
                                <h3>${name}</h3>
                                <p class="info">📍 Racecourse: <a href="${trackLink}" target="_blank" class="track-link">${trackName}</a></p>
                                <p class="info">🏆 Winner: ${winner}</p>
                                <div class="btn-row">
                                    ${racecard ? `<a href="${racecard}" target="_blank" class="btn btn-blue">Racecard</a>` : ''}
                                    ${video ? `<a href="${video}" target="_blank" class="btn btn-red">Video</a>` : ''}
                                    ${results ? `<a href="${results}" target="_blank" class="btn btn-green">Results</a>` : ''}
                                </div>
                            </div>
                        `;
                    }
                });
            });
    </script>
</body>
</html>
