<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>GR1 Kiitolaukkaurheilu</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --gold: #d4af37; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; }
        h1 { color: var(--gold); text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        .btn-row { margin-top: 15px; display: flex; gap: 5px; flex-wrap: wrap; }
        .btn { padding: 6px 10px; border-radius: 4px; text-decoration: none; font-size: 0.7rem; font-weight: bold; color: white; }
        .bg-blue { background: #2563eb; }
        .bg-red { background: #dc2626; }
        .bg-green { background: #16a34a; }
        .bg-earth { background: #059669; }
    </style>
</head>
<body>
    <h1>GR1 Kiitolaukkaurheilu 2026</h1>
    <div id="grid" class="grid">Ladataan tietoja...</div>

    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/19VMjcAwo-xSw65m9JiUJ2u0hcgH3eh4DU726nnZDzwg/gviz/tq?tqx=out:csv";

        fetch(csvUrl).then(res => res.text()).then(csv => {
            const lines = csv.split('\n').slice(1);
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            lines.forEach(line => {
                const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if(cols.length > 5) {
                    // Haetaan datat suoraan soluista
                    const name = cols[0].replace(/"/g, '');
                    const country = cols[2].replace(/"/g, '');
                    const racecourse = cols[3].replace(/"/g, '');
                    const racecourseLink = cols[4].replace(/"/g, ''); // Sarake E (D+1)
                    const surface = cols[5].replace(/"/g, '');
                    const racecard = cols[9].replace(/"/g, '');  // Sarake J
                    const video = cols[11].replace(/"/g, '');    // Sarake L
                    const results = cols[13].replace(/"/g, '');  // Sarake N
                    const earth = `https://earth.google.com/search/${encodeURIComponent(racecourse)}`;

                    grid.innerHTML += `
                        <div class="card">
                            <h3>${name}</h3>
                            <p>🌍 ${country}</p>
                            <p>📍 <a href="${racecourseLink}" target="_blank">${racecourse}</a> (${surface})</p>
                            <div class="btn-row">
                                ${racecard ? `<a href="${racecard}" target="_blank" class="btn bg-blue">Racecard</a>` : ''}
                                ${video ? `<a href="${video}" target="_blank" class="btn bg-red">Video</a>` : ''}
                                ${results ? `<a href="${results}" target="_blank" class="btn bg-green">Results</a>` : ''}
                                <a href="${earth}" target="_blank" class="btn bg-earth">Google Earth</a>
                            </div>
                        </div>`;
                }
            });
        });
    </script>
</body>
</html>
