<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>GR1 Laukkaurheilu</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; }
        .btn { display: inline-block; padding: 5px 10px; margin-right: 5px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Laukkaurheilun tilanne</h1>
    <div id="lista"></div>

    <script>
        const url = "https://docs.google.com/spreadsheets/d/19VMjcAwo-xSw65m9JiUJ2u0hcgH3eh4DU726nnZDzwg/gviz/tq?tqx=out:csv";
        
        fetch(url)
        .then(res => res.text())
        .then(csv => {
            const lines = csv.split('\n').slice(1);
            const container = document.getElementById('lista');
            container.innerHTML = '';
            
            lines.forEach(line => {
                const row = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, ''));
                if(row.length > 5) {
                    const name = row[1];
                    // Etsitään http-linkit riviltä
                    const urls = line.match(/(https?:\/\/[^\s",]+)/g) || [];
                    
                    let html = `<div class="card"><h3>${name}</h3>`;
                    if(urls[0]) html += `<a href="${urls[0]}" target="_blank" class="btn">Racecard</a>`;
                    if(urls[1]) html += `<a href="${urls[1]}" target="_blank" class="btn">Video</a>`;
                    if(urls[2]) html += `<a href="${urls[2]}" target="_blank" class="btn">Results</a>`;
                    html += `</div>`;
                    container.innerHTML += html;
                }
            });
        });
    </script>
</body>
</html>
