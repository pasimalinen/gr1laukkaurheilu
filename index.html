<!DOCTYPE html>
<html>
<body>
    <h1>Raakadata (JSON):</h1>
    <pre id="data"></pre>

    <script>
        const url = "https://docs.google.com/spreadsheets/d/19VMjcAwo-xSw65m9JiUJ2u0hcgH3eh4DU726nnZDzwg/gviz/tq?tqx=out:json";
        fetch(url)
            .then(res => res.text())
            .then(text => {
                document.getElementById('data').innerText = text;
                console.log(text);
            })
            .catch(err => document.getElementById('data').innerText = "Virhe: " + err);
    </script>
</body>
</html>
