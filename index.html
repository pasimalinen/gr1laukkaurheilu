<script>
    fetch(csvUrl).then(res => res.text()).then(csv => {
        const lines = csv.split('\n').slice(1);
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        
        lines.forEach(line => {
            // Jaetaan rivi osiin
            const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, ''));
            
            if(cols.length > 5) {
                const name = cols[1];
                const track = cols[3];
                
                // Funktio, joka etsii http-linkin tietystä solusta
                const getLink = (colIndex) => {
                    if (!cols[colIndex]) return null;
                    const match = cols[colIndex].match(/(https?:\/\/[^"\s]+)/);
                    return match ? match[0] : null;
                };

                const racecard = getLink(9);
                const video = getLink(11);
                const results = getLink(13);
                const earth = getLink(14);

                grid.innerHTML += `
                    <div class="card">
                        <h3>${name}</h3>
                        <p>📍 ${track}</p>
                        <div>
                            ${racecard ? `<a href="${racecard}" target="_blank" class="btn" style="background:#2563eb">Racecard</a>` : ''}
                            ${video ? `<a href="${video}" target="_blank" class="btn" style="background:#dc2626">Video</a>` : ''}
                            ${results ? `<a href="${results}" target="_blank" class="btn" style="background:#16a34a">Results</a>` : ''}
                            ${earth ? `<a href="${earth}" target="_blank" class="btn" style="background:#059669">Google Earth</a>` : ''}
                        </div>
                    </div>`;
            }
        });
    });
</script>
