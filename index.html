<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Diagnostiikka</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; }
        .card { background: #1e293b; padding: 10px; margin-bottom: 10px; border: 1px solid red; }
    </style>
</head>
<body>
    <h1>Sarake-diagnostiikka (kopioi tämä tieto minulle)</h1>
    <div id="debug"></div>

    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/19VMjcAwo-xSw65m9JiUJ2u0hcgH3eh4DU726nnZDzwg/gviz/tq?tqx=out:csv";

        fetch(csvUrl).then(res => res.text()).then(text => {
            const lines = text.split('\n').slice(1);
            const debug = document.getElementById('debug');
            
            lines.forEach((line, index) => {
                const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                // Tulostetaan vain ensimmäinen rivi nähdäksemme sarakkeiden järjestyksen
                if (index === 0) {
                    debug.innerHTML = `<div class="card"><strong>Rivin 1 sarakkeet:</strong><br>${cols.map((val, i) => `${i}: ${val}`).join('<br>')}</div>`;
                }
            });
        });
    </script>
</body>
</html>
