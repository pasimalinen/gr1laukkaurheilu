<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>GR1 Laukkaurheilu</title>
</head>
<body>
    <div id="grid"></div>
    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/19VMjcAwo-xSw65m9JiUJ2u0hcgH3eh4DU726nnZDzwg/gviz/tq?tqx=out:csv";

        fetch(csvUrl)
            .then(res => res.text())
            .then(csv => {
                const lines = csv.split('\n').slice(1);
                const grid = document.getElementById('grid');
                grid.innerHTML = '';
                
                lines.forEach(line => {
                    // Etsitään riviltä kaikki URL-osoitteet
                    const urlMatch = line.match(/(https?:\/\/[^",]+)/g);
                    const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    
                    if(cols.length > 1) {
                        const name = cols[1].replace(/"/g, '');
                        // Etsitään juuri tähän riviin liittyvä linkki
                        const link = urlMatch ? urlMatch[0] : null;

                        grid.innerHTML += `
                            <div class="card" style="margin:10px; padding:10px; border:1px solid #ccc;">
                                <h3>${name}</h3>
                                ${link ? `<a href="${link}" target="_blank">Avaa Racecard</a>` : 'Ei linkkiä'}
                            </div>`;
                    }
                });
            });
    </script>
</body>
</html>
