<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GR1 Laukkaurheilu</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #0f172a; color: #f8fafc; }
        .grid { display: grid; gap: 15px; }
        .card { background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
        h3 { margin: 0 0 10px 0; color: #38bdf8; }
        .btn { display: inline-block; padding: 8px 12px; margin-right: 8px; color: white; text-decoration: none; border-radius: 4px; font-size: 13px; font-weight: bold; }
        .rc { background: #2563eb; }
        .vd { background: #dc2626; }
        .rs { background: #16a34a; }
    </style>
</head>
<body>
    <h1>GR1 Laukkaurheilu</h1>
    <div id="lista" class="grid">Ladataan tietoja...</div>

    <script>
        const url = "https://docs.google.com/spreadsheets/d/19VMjcAwo-xSw65m9JiUJ2u0hcgH3eh4DU726nnZDzwg/gviz/tq?tqx=out:json";
        
        fetch(url)
        .then(res => res.text())
        .then(text => {
            const json = JSON.parse(text.substr(47).slice(0, -2));
            const container = document.getElementById('lista');
            container.innerHTML = '';
            
            // Apufunktio linkin etsimiseen
            const findRealLink = (cell) => {
                if (!cell) return null;
                const rawData = (cell.f || "") + (cell.v || "");
                const match = rawData.match(/(https?:\/\/[^"'\s\)]+)/);
                return match ? match[0] : null;
            };

            json.table.rows.forEach(row => {
                const c = row.c;
                if (!c[1]) return; // Ohitetaan tyhjät rivit
                
                const name = c[1]?.v || "Ei nimeä";
                
                // MÄÄRITÄ TÄSSÄ SARAKKEIDEN NUMEROT:
                // A=0, B=1, C=2, D=3, E=4, F=5, G=6, H=7, I=8, J=9, K=10, L=11, M=12, N=13
                const racecard = findRealLink(c[9]);
                const video = findRealLink(c[11]);
                const results = findRealLink(c[13]);

                let html = `<div class="card"><h3>${name}</h3>`;
                if(racecard) html += `<a href="${racecard}" target="_blank" class="btn rc">Racecard</a>`;
                if(video) html += `<a href="${video}" target="_blank" class="btn vd">Video</a>`;
                if(results) html += `<a href="${results}" target="_blank" class="btn rs">Results</a>`;
                html += `</div>`;
                container.innerHTML += html;
            });
        })
        .catch(err => {
            document.getElementById('lista').innerHTML = "Virhe tietojen lataamisessa.";
            console.error(err);
        });
    </script>
</body>
</html>
