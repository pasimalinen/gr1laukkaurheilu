<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>GR1 Laukkaurheilu</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; }
        .btn { display: inline-block; padding: 6px 12px; margin-right: 5px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Laukkaurheilu</h1>
    <div id="lista">Ladataan tietoja...</div>

    <script>
        // Käytetään suoraa CSV-hakua, se on vakain tapa välttää virheet
        const url = "https://docs.google.com/spreadsheets/d/19VMjcAwo-xSw65m9JiUJ2u0hcgH3eh4DU726nnZDzwg/gviz/tq?tqx=out:csv";
        
        fetch(url)
        .then(res => res.text())
        .then(csv => {
            const rows = csv.split('\n');
            const container = document.getElementById('lista');
            container.innerHTML = '';
            
            // Käydään rivit läpi (aloitetaan riviltä 1, hypätään otsikot)
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if (row.length < 2) continue; // Skipataan tyhjät
                
                const name = row[1] ? row[1].replace(/"/g, '') : "Nimetön";
                
                // Luodaan HTML-kortti
                let html = `<div class="card"><h3>${name}</h3>`;
                
                // Lisätään napit, jos linkki löytyy (etsitään https tekstiä)
                if (rows[i].includes("http")) {
                    const links = rows[i].match(/https?:\/\/[^",]+/g);
                    if (links) {
                        links.forEach((link, index) => {
                            if (index < 3) {
                                html += `<a href="${link.replace(/"/g, '')}" target="_blank" class="btn">Linkki ${index+1}</a>`;
                            }
                        });
                    }
                }
                
                html += `</div>`;
                container.innerHTML += html;
            }
        })
        .catch(err => {
            document.getElementById('lista').innerHTML = "Latausvirhe.";
        });
    </script>
</body>
</html>
