<script>
    const url = "https://docs.google.com/spreadsheets/d/19VMjcAwo-xSw65m9JiUJ2u0hcgH3eh4DU726nnZDzwg/gviz/tq?tqx=out:json";
    
    fetch(url)
    .then(res => res.text())
    .then(text => {
        const json = JSON.parse(text.substr(47).slice(0, -2));
        const container = document.getElementById('lista');
        container.innerHTML = '';
        
        json.table.rows.forEach(row => {
            const c = row.c;
            if (!c[1]) return;
            
            // TÄMÄ ON KORJAUS: Etsimme linkkiä "f"-kentästä (kaava) tai "v"-kentästä
            const extractLink = (col) => {
                if (!col) return null;
                // Jos solussa on linkki, se on muodossa HYPERLINK("url"; "teksti")
                const match = (col.f || "").match(/HYPERLINK\("([^"]+)"/);
                return match ? match[1] : null;
            };

            const name = c[1]?.v;
            const racecard = extractLink(c[9]);
            const video = extractLink(c[11]);
            const results = extractLink(c[13]);

            let html = `<div class="card"><h3>${name}</h3>`;
            if(racecard) html += `<a href="${racecard}" target="_blank" class="btn">Racecard</a>`;
            if(video) html += `<a href="${video}" target="_blank" class="btn">Video</a>`;
            if(results) html += `<a href="${results}" target="_blank" class="btn">Results</a>`;
            html += `</div>`;
            container.innerHTML += html;
        });
    });
</script>
