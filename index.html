<!DOCTYPE html>
<html lang="fi">
<body>
    <h1>Tarkistetaan dataa... (katso Console / F12)</h1>
    <script>
        const sheetId = '19VMjcAwo-xSw65m9JiUJ2u0hcgH3eh4DU726nnZDzwg';
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

        fetch(url).then(res => res.text()).then(text => {
            const json = JSON.parse(text.substr(47).slice(0, -2));
            console.log("Koko data:", json.table.rows);
            json.table.rows.forEach((row, i) => {
                console.log("Rivi " + i + " tiedot:", row.c.map(cell => cell ? (cell.v || cell.f) : "tyhjä"));
            });
        });
    </script>
</body>
</html>
