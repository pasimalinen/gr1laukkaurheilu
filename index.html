<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>GR1 Kiitolaukkaurheilu</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --gold: #d4af37; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        .btn-row { margin-top: 15px; display: flex; gap: 5px; }
        .btn { padding: 5px 10px; font-size: 0.7rem; border-radius: 4px; text-decoration: none; color: white; }
    </style>
</head>
<body>
    <h1>GR1 Kiitolaukkaurheilu 2026</h1>
    <div id="grid" class="grid">Ladataan...</div>

    <script>
        const url = "https://docs.google.com/spreadsheets/d/19VMjcAwo-xSw65m9JiUJ2u0hcgH3eh4DU726nnZDzwg/gviz/tq?tqx=out:csv";

        fetch(url).then(res => res.text()).then(csv => {
            const lines = csv.split('\n');
            const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim().toLowerCase());
            
            // Etsitään indeksit dynaamisesti
            const getIdx = (name) => headers.findIndex(h => h.includes(name));
            const iRace = 0; // Oletus: eka sarake
            const iTrack = getIdx('rata') > -1 ? getIdx('rata') : 2;
            const iLink = getIdx('linkki') > -1 ? getIdx('linkki') : 3;
            const iDate = getIdx('päiv') > -1 ? getIdx('päiv') : 4;
            const iRacecard = getIdx('racecard') > -1 ? getIdx('racecard') : 9;
            const iWinner = getIdx('voittaja') > -1 ? getIdx('voittaja') : 10;
            const iVideo = getIdx('video') > -1 ? getIdx('video') : 11;
            const iResults = getIdx('result') > -1 ? getIdx('result') : 13;

            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            for(let n = 1; n < lines.length; n++) {
                const cols = lines[n].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if(cols.length < 2) continue;
                
                grid.innerHTML += `
                    <div class="card">
                        <h3>${cols[iRace]}</h3>
                        <p>Pvm: ${cols[iDate]}</p>
                        <p>Rata: <a href="${cols[iLink]}" target="_blank">${cols[iTrack]}</a></p>
                        <div class="btn-row">
                            <a href="${cols[iRacecard]}" class="btn" style="background:blue">Racecard</a>
                            <a href="${cols[iVideo]}" class="btn" style="background:red">Video</a>
                            <a href="${cols[iResults]}" class="btn" style="background:green">Results</a>
                        </div>
                    </div>`;
            }
        });
    </script>
</body>
</html>
